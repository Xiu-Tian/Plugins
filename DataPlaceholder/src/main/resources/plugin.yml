name: DataPlaceholder
version: '1.0.0'
main: org.FixSky.dataPlaceholder.DataPlaceholder
api-version: '1.21'
softdepend: [PlaceholderAPI]
commands:
  dp:
    description: DataPlaceholder 主命令
    usage: |
      /dp help
      /dp setdata <键> <值>       - 设置自己的数据
      /dp setdata <玩家> <键> <值> - 设置其他玩家的数据
      /dp removedata <键>         - 删除自己的数据
      /dp removedata <玩家> <键>   - 删除其他玩家的数据
      /dp getdata [键]            - 查看自己的数据
      /dp getdata <玩家> [键]      - 查看其他玩家的数据
      /dp test <键> [玩家]        - 测试占位符解析