name: RandomTeleport
version: '1.0-SNAPSHOT'
main: org.SuperMan.randomTeleport.RandomTeleport
api-version: '1.21'
author: FixSky
description: 支持多世界、自定义消息、Tab补全、重试音效的随机传送插件
commands:
  rtp:
    description: 随机传送至配置的世界，或指定世界
    usage: |
      /rtp - 随机选择一个已配置的世界传送
      /rtp <世界名> - 传送到指定的配置世界
      /rtp list - 查看所有可用世界
      /rtp reload - 重载配置
      /rtp help - 查看帮助
permissions:
  randomteleport.use:
    description: 允许使用 /rtp 传送
    default: true
  randomteleport.reload:
    description: 允许重载配置
    default: op